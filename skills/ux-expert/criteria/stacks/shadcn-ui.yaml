id: shadcn-ui
name: shadcn/ui
kind: component-library
summary: Read when the project has a `components.json` at its root. shadcn/ui components are copied into the project,
  so audit them as the team's own code, starting from what the upstream versions already get right.
detect:
  files: [components.json]
verified:
  version: 'new-york-v4 registry (Tailwind CSS 4, React 19)'
  repository: https://github.com/shadcn-ui/ui
  commit: 2d3f1cd436b18ea12f24130de4df781355925b08
  verified_on: '2026-10-10'
evidence:
- what: The components actually in use
  where: '`components/ui/*.tsx` (path set by the `ui` alias in `components.json`); each file may differ from upstream'
- what: Underlying primitives
  where: 'Imports in `components/ui/*.tsx`: `radix-ui` or `@radix-ui/react-*` (Radix), `@base-ui/react` (Base UI), `react-aria-components` (React Aria)'
- what: Theme tokens and dark mode
  where: 'The global CSS file named in `components.json`: tokens under `:root` and `.dark`, exposed with `@theme inline`; colors in OKLCH'
- what: Toasts, forms, sidebar
  where: '`components/ui/sonner.tsx` (toasts), `field.tsx` or `form.tsx` (form fields), `sidebar.tsx` (navigation shell)'
gotchas:
- text: shadcn/ui is not a dependency but code copied into the project, open for modification. Compare a suspicious component with the upstream file before attributing a defect to shadcn/ui, and report it against the project's file.
  criteria: [DS-06, DS-10]
  source: apps/v4/content/docs/(root)/index.mdx
- text: New projects default to Base UI primitives; Radix and React Aria are still supported. Check the imports in `components/ui` before applying Radix behaviour (the Radix pack) to a project.
  criteria: [DS-10]
  source: apps/v4/content/docs/changelog/2026-07-base-ui-default.mdx
- text: Buttons, inputs, selects, checkboxes and tabs replace the outline with a 3 px `focus-visible` ring, so `outline-none` in these files is not an A11Y-04 defect. Menu and select items show focus only as a background change (`focus:bg-accent`); check its contrast against the menu background.
  criteria: [A11Y-04, COL-10]
  source: apps/v4/registry/new-york-v4/ui/button.tsx
- text: Default button and icon-button sizes are 36 px (`h-9`, `size-9`) and the smallest sizes 24 px, which meets WCAG 2.5.8. The checkbox is 16 px (`size-4`) and the switch about 18 px high; check spacing or a clickable label before reporting a target-size failure.
  criteria: [A11Y-20, RESP-07]
  source: apps/v4/registry/new-york-v4/ui/button.tsx
- text: Inputs style `aria-invalid`, but only if the code sets it. The current form docs wire `aria-invalid` and `data-invalid` by hand on each `Field`; a missing attribute leaves errors invisible to screen readers.
  criteria: [FORM-10, A11Y-24]
  source: apps/v4/content/docs/forms/react-hook-form.mdx
- text: The older `Form` component wires `aria-invalid` and `aria-describedby` (description plus message) automatically through `FormControl`. A custom field that skips `FormControl` loses both.
  criteria: [FORM-03, A11Y-24]
  source: apps/v4/registry/new-york-v4/ui/form.tsx
- text: Upstream icon controls carry `sr-only` text or `aria-label` (dialog close, carousel, pagination). Icon-only `Button`s written by the team do not get one automatically; each needs a label.
  criteria: [A11Y-10]
  source: apps/v4/registry/new-york-v4/ui/dialog.tsx
- text: '`TooltipProvider` defaults to `delayDuration = 0`, so tooltips open instantly on hover. Information only in a tooltip is still hover- or focus-only (INT-13).'
  criteria: [INT-13]
  source: apps/v4/registry/new-york-v4/ui/tooltip.tsx
- text: The `toast` component is deprecated in favour of Sonner (`sonner.tsx`), which follows the theme from `next-themes`. Check toasts for INT-14 in the Sonner usage, not in a leftover `toast.tsx`.
  criteria: [INT-14]
  source: apps/v4/content/docs/(root)/tailwind-v4.mdx
- text: The sidebar toggles with Ctrl/Cmd+B, persists its state in a cookie and becomes a sheet on mobile with a visually hidden header. Check the shortcut does not clash with text editing in the app (B for bold).
  criteria: [INT-16]
  source: apps/v4/registry/new-york-v4/ui/sidebar.tsx
- text: Projects on Tailwind 3 keep receiving Tailwind 3 and React 18 versions of components until they upgrade, and files added before an upgrade keep their old styles. Mixed focus rings or radii between files are often this, not design drift.
  criteria: [AES-01, DS-04]
  source: apps/v4/content/docs/(root)/tailwind-v4.mdx
- text: The CLI can rewrite physical positioning classes to logical ones for right-to-left layouts. Components added before RTL was enabled keep `left`/`right` classes.
  criteria: [I18N-09]
  source: apps/v4/content/docs/rtl/index.mdx
extensions: [.tsx, .jsx]
probes:
- id: shadcn-icon-button-unlabeled
  kind: review
  pattern: 'size="icon(-xs|-sm|-lg)?"'
  look_for: Icon-only buttons; each needs `aria-label` or `sr-only` text.
  criteria: [A11Y-10]
  example: '<Button variant="ghost" size="icon"><Trash2 /></Button>'
  counter_example: '<Button variant="ghost" size="sm">Delete</Button>'
- id: shadcn-aria-invalid
  kind: inventory
  pattern: 'aria-invalid=|data-invalid'
  look_for: Fields that expose their error state. Compare with the number of validated fields.
  criteria: [FORM-10, A11Y-24]
  example: '<Input aria-invalid={fieldState.invalid} />'
- id: shadcn-dialog-without-title
  kind: review
  pattern: '<DialogContent|<SheetContent|<AlertDialogContent'
  look_for: Each dialog or sheet needs a `DialogTitle` (visually hidden if needed) so it has an accessible name.
  criteria: [A11Y-10, INT-11]
  example: '<DialogContent className="sm:max-w-md">'
  counter_example: '<DialogTitle>Edit profile</DialogTitle>'
- id: shadcn-hardcoded-color-class
  kind: smell
  pattern: '\b(bg|text|border|ring)-(red|blue|green|gray|slate|zinc|neutral|yellow|orange|purple)-\d{2,3}\b'
  look_for: Palette classes that bypass the theme tokens (`bg-primary`, `text-muted-foreground`) and dark mode.
  criteria: [DS-03, COL-12]
  example: '<span className="text-gray-500">Saved</span>'
  counter_example: '<span className="text-muted-foreground">Saved</span>'
