name: release

# Runs when a release tag (vX.Y.Z) is pushed to main. It publishes the MCP
# server to npm and attaches the release notes; see CONTRIBUTING.md §7.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
