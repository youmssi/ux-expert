name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # Reference validator for the Agent Skills spec (not published to PyPI).
  SKILLS_REF: "skills-ref @ git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the repository validator
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Repository rules
        run: python scripts/validate.py
      - name: Agent Skills spec
        run: |
          pip install "$SKILLS_REF"
          for skill in skills/*/; do skills-ref validate "$skill"; done
